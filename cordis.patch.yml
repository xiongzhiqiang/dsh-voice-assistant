# 「小凤」语音助手 for DeepSeek Harness.
#
# 本 bundle 只做**增量插入**：不接管 root、不禁用任何官方插件。
# 语音球注册在官方 `shell.overlay` 槽（list 槽，可叠加、默认 click-through），
# 因此与金凤整壳（dsh-jinfeng-ui 接管 root）可以共存 —— 只要它也在
# children 里声明了 shell.overlay。若金凤壳未声明该席位，把本插件放在
# 官方壳下使用，或按 README 的「与整壳插件共存」一节补一行声明。
#
# ── 回滚 ────────────────────────────────────────────────────────────────
#
# 把下面 `disabled: true` 打开并重启 dsh 即可；本文件没有 disable 任何
# 官方行，删掉整段 insert 也不会影响其他插件。
- insert:
    - id: voice-assistant
      name: 'dsh-voice-assistant'
      config:
        # ── 唤醒 ────────────────────────────────────────────────────────
        wake:
          word: '小凤'
          # 同音/近音容错：Web Speech 的识别结果经常写成别的字，
          # 只认一个字面量等于把唤醒率压到一半以下。
          aliases: ['小风', '晓凤', '小枫', '小丰', '小峰', '校风']
          # 是否允许唤醒词出现在句子中间（true = "小凤帮我看下" 直接唤醒并带上指令）
          inlineCommand: true

        # ── 语言 ────────────────────────────────────────────────────────
        language: 'zh-CN'

        # ── 休眠 ────────────────────────────────────────────────────────
        sleep:
          # 无语音、无播报、无 agent 消息的静默时长；到点进入休眠。
          idleTimeoutMs: 60000
          # 休眠时是否仍保留唤醒词监听（true 更"随时在线"，但麦克风常开、
          # 浏览器会显示录音指示灯）。默认 false：休眠即释放麦克风。
          keepWakeWord: false
          # 唤醒/休眠提示音（WebAudio 合成，无外部资源）
          chime: true

        # ── 语音识别（转录）──────────────────────────────────────────────
        asr:
          # auto       = 浏览器识别优先，失败时按死名单降级（ears / sensevoice / http）
          # ears       = 强制走本地 Whisper（项目内置实现）
          # sensevoice = 强制走本地 SenseVoice（项目内置实现，不联网）
          # webspeech  = 只用浏览器 Web Speech API
          # http       = 只用下面 http 里配的 OpenAI 兼容端点
          #
          # 2026-11-25 用户确认改为固定本地 SenseVoice：
          # 断网也能识别，且不受浏览器 Web Speech 可用性影响。
          engine: 'sensevoice'
          http:
            baseURL: ''
            apiKey: ''
            model: 'whisper-1'
            # 单段最长录音，超过强制切段
            maxSegmentMs: 15000

        # ── 语音合成（播报）──────────────────────────────────────────────
        tts:
          # browser = speechSynthesis（本地系统语音，零延迟、零流量）
          # http    = 宿主代理到 OpenAI 兼容 /audio/speech
          engine: 'browser'
          voice: ''
          rate: 1
          http:
            baseURL: ''
            apiKey: ''
            model: 'tts-1'
            voice: 'alloy'

        # ── 转录润色 ────────────────────────────────────────────────────
        polish:
          enabled: true
          # clean     = 去口癖、补标点、不改语义（默认）
          # concise   = 在上者基础上压缩成一句可执行的指令
          # structured = 输出分点（适合"帮我梳理一下…"）
          style: 'clean'
          # 留空 = 跟随 DSH 当前默认模型
          provider: ''
          model: ''
          timeoutMs: 8000
          # 润色失败时是否退回规则清理（去重、去口癖、补句号）
          fallback: true

        # ── 常驻 agent ──────────────────────────────────────────────────
        #
        # 助手在 DSH 层常驻，不需要打开任何会话。语音指令直接进它的收件箱，
        # 工具调用/审批/提问全部走 DSH 官方循环。
        agent:
          enabled: true
          # 稳定标识：首次用它创建，重启后用它 resume，记忆不断。
          # V1.8：换成 -v2 —— 旧 root 会话里残留 DSH 原生智能体团队
          # （team/task + subagent/catalog 三位 spawn 子智能体），与插件专家系统
          # 混在一起。新 id 让常驻助手在干净会话里全新启动；旧会话已由
          # tools/backup-team-sessions.mjs 移出 sessions/ 备份（不删除）。
          sessionId: 'session-voice-assistant-root-v2'
          # 助手的工作目录（工具落地处）；留空 = 取第一个工作区，再退到主目录。
          cwd: ''
          # true = 跨重启保留记忆（依赖 sessionPersistence）
          persist: true
          # 模型路由：两项都留空 = 跟随界面上选的默认模型（推荐）。
          # 只在需要让助手固定用某个模型时才两项一起填。
          provider: ''
          model: ''
          # 思考中保持开麦，识别到的话作为 steer 插话纠偏（而不是新指令）。
          # 注意还要把下面的 turn.steerWhileThinking 也打开才真正生效。
          steer: true
          # 人格段（会被朗读，所以约束成口语化短句）。留空 = 用内置默认。
          persona: ''

        # ── 轮次判据（什么时候算"你这一轮说完了"）────────────────────────
        #
        # 识别引擎给的是一段段**片段**（约 1 秒静音就切一段，粒度是给字幕用的），
        # 片段不等于"说完了"。这里决定片段攒到什么时候才提交给模型。
        turn:
          # 声音停止多久 = 这一轮说完了。默认 5 秒。
          #   太长：每轮都要干等这么久才得到回应；太短：还没说完就被提交（只回了半句）。
          # 当前取 5 秒（2026-11-19 按用户要求从 10 秒调小）：人说话的句中停顿
          # （想词、换气）一般 2–5 秒，5 秒仍能跨过多数停顿，但等待感明显变短。
          # 若发现"话说到一半被提交"，单击语音球可立即提交已攒内容；
          # 想放宽就调大这个值。下界 3s、上界 10min（越界会被自动夹取）。
          # 等不及的时候：**单击语音球**立即提交，不必干等。
          #
          # ⚠️ 这个值必须与 `core/constants.js` 的 `SILENCE_SUBMIT_MS`、
          # `lib/config.js` 的默认值、`README.md` 与三套测试**保持一致**，
          # 否则会出现"代码默认 10s、实机跑 5s"的幽灵差异
          # （`smoke-turn-gate` 有一条断言专门钉这个一致性）。
          silenceMs: 5000
          # 单轮硬上限：连续不断说话时的安全阀，到点无论如何提交一次。
          # 必须大于 silenceMs（小于会被自动抬到 silenceMs + 5s）。
          maxTurnMs: 300000
          # 识别到的话若就是助手自己刚念的，丢弃（防"自说自话"）。
          echoGuard: true
          # 思考中是否开麦插话纠偏。默认 false —— 开着的话，环境里任何人声
          # 都会被当成"插话"注入正在跑的 turn，是自说自话的另一入口。
          steerWhileThinking: false

        # ── 语音应答（只做「模型提问」，不碰「工具审批」）────────────────
        #
        # 范围为什么收窄到只有提问：`approval/request`（工具权限）放行的是
        # **有副作用的操作**（跑 bash、写文件），语音误听（环境人声、识别错字）
        # 会造成真实损害；而 `ask_user_question` 只是"要一个信息"，答错最多
        # 重问一次。所以工具审批一律交回界面，语音只念、不答。
        answers:
          # 问题播报 + 等用户开口的总预算；到点就把答案交回界面（不猜）。
          questionTimeoutMs: 60000
          # 念问题前是否响一声提示音（沿用 sleep.chime 的总开关）。
          chime: true
          # 用户没答上时，是否把问题原样再念一遍（最多一次，防打扰）。
          repeatOnce: true

        # ── 会话 ────────────────────────────────────────────────────────
        session:
          # persistent = retain 宿主创建的常驻 agent 会话（默认，跨会话常驻）
          # dedicated  = 插件自建并维护一个"语音会话"（独立，不污染手打对话）
          # active     = 复用当前界面选中的会话（当前版本降级为 dedicated）
          mode: 'persistent'
          title: '小凤语音会话'
          # 语音会话的工作目录；留空 = 宿主默认
          workspace: ''
          # 常驻会话在侧边栏的**标注名**。
          #
          # 注意这里刻意是"标注"而不是"隐藏"：DSH 里没有安全的隐藏机制 ——
          #   * `archiveSession(id)` 会让助手彻底哑掉（本 profile 注册了归档
          #     闸门，对 `agent/pre-step` 直接 reject）；
          #   * 把会话标记成 `origin:'subagent'` 会让它连不上（宿主按普通 id
          #     访问时抛 `session/agent-busy`）。
          # 所以在侧边栏**可见但一眼可辨**才是唯一不损坏功能的做法：
          # 用户知道那一条是常驻助手，不会误当成自己的对话。
          # 空字符串 = 不改名（把标题交回 DSH 自动生成）。
          label: '小凤 · 常驻助手'

        # ── 全局记忆 ────────────────────────────────────────────────────
        #
        # 把一段文字注册成**全局**系统提示段，对 DSH 里**所有**会话生效。
        # 这是"记忆为全局记忆"这条需求的落点，与 `agent.persona` 的区别
        # 只在作用域：persona 挂在常驻 agent 上（只对那一只生效），
        # 本项挂在根作用域（所有会话都看得到）。
        #
        # 默认关闭：往每个会话的每一轮提示里塞文字是有代价的（占 token、
        # 也可能影响你自己手打会话的行为），必须由你显式开启。
        memory:
          # true = 注册为全局 prompt 段
          global: false
          # 记忆正文。留空 = 即使 global 为真也不注册。
          # 例：
          #   text: |
          #     我叫 xqz19，常用 Windows + PowerShell，工作目录在 D:\work。
          #     回答尽量简短，先说结论。涉及文件路径时给绝对路径。
          text: ''

        # ── 浮层 ────────────────────────────────────────────────────────
        ui:
          position: 'bottom-right'
          accent: '#2f6bff'
          showTranscript: true
        routing:
          expertDirs:
            - C:\Users\xqz19\.dsh\voice-assistant\experts
